name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Linux — enforces the platform boundary.
  # If anyone leaks an Apple framework into `Aria`, this job breaks.
  # ------------------------------------------------------------------
  linux-core:
    name: Linux — Core Build & Test
    runs-on: ubuntu-latest
    container:
      image: swift:6.1-jammy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SQLite headers
        # GRDB.swift's C shim needs sqlite3.h. The swift Docker image
        # ships with sqlite3 the binary but not the development headers.
        # Aria core does not depend on GRDB, but `swift test` builds
        # every test target — AriaAppleTests transitively pulls GRDB.
        run: apt-get update && apt-get install -y libsqlite3-dev

      - name: Show Swift version
        run: swift --version

      - name: Build core target
        run: swift build --target Aria

      - name: Build testing target
        run: swift build --target AriaTesting

      - name: Build tools target
        run: swift build --target AriaTools

      - name: Run core tests
        run: swift test --filter AriaTests

  # ------------------------------------------------------------------
  # macOS — full build & test of every target including AriaApple.
  # Driven by Fastlane lanes so the local dev workflow and CI run
  # the exact same commands. See `fastlane/Fastfile` for definitions.
  # ------------------------------------------------------------------
  macos:
    name: macOS — Full Build & Test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          # mlx-swift-lm's MLXVLM target uses a global `let context =
          # CIContext()` that trips Swift 6.0's strict-concurrency
          # rules in Xcode 16.4 (the macos-15 default). Xcode 26.x
          # ships Swift 6.1+ which accepts the pattern. Probe in
          # preference order and select the first that exists.
          for xcode in /Applications/Xcode_26*.app /Applications/Xcode-26*.app /Applications/Xcode_latest.app /Applications/Xcode.app; do
            if [ -d "$xcode" ]; then
              sudo xcode-select -s "$xcode/Contents/Developer"
              echo "Selected: $xcode"
              break
            fi
          done

      - name: Show Swift version
        run: swift --version

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Ruby + bundler (for Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run root-package build + tests via Fastlane
        run: bundle exec fastlane package_tests

      - name: Run CLI demo via Fastlane
        run: bundle exec fastlane cli_demo

      - name: Build + test AriaMLX sub-package
        # AriaMLX moved to its own SwiftPM package so consumers
        # (e.g. iOS apps using only FoundationModels) don't pull in
        # `swift-transformers-mlx` and conflict with WhisperKit's
        # transitive pin. Build + test it independently. No
        # Fastlane lane yet because the sub-package has its own
        # `Package.swift` — kept as a direct `swift test` until the
        # MLX sub-package gains its own Fastlane wrapper.
        run: |
          cd MLX
          swift build
          swift test

  # ------------------------------------------------------------------
  # iOS — build the Avyra app on iOS Simulator (also exercises AriaApple).
  # Uses the Fastlane lane that local developers run, so any CI-only
  # surprise is also a local-dev surprise.
  # ------------------------------------------------------------------
  ios-app:
    name: iOS — Avyra Build
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List installed Xcodes
        run: ls /Applications | grep -i xcode || true

      - name: Select latest Xcode
        run: |
          # Try the newest Xcode available on the runner; the iOS 26 SDK
          # is required for FoundationModels. We probe candidates in order
          # of preference and select the first that exists.
          for xcode in /Applications/Xcode_26*.app /Applications/Xcode-26*.app /Applications/Xcode_latest.app /Applications/Xcode.app; do
            if [ -d "$xcode" ]; then
              sudo xcode-select -s "$xcode/Contents/Developer"
              echo "Selected: $xcode"
              xcodebuild -version
              break
            fi
          done

      - name: Set up Ruby + bundler (for Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build Avyra for iOS Simulator via Fastlane
        run: bundle exec fastlane app_local_build

  # ------------------------------------------------------------------
  # Quality — SwiftFormat + SwiftLint checks via Fastlane's
  # `ci_quality` lane. Same command developers run pre-commit, so
  # the bar is consistent across local + CI.
  # ------------------------------------------------------------------
  quality:
    name: Quality — SwiftFormat & SwiftLint
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tooling
        run: |
          # Pin swiftformat to a specific version so the CI's lint
          # rules don't drift relative to the version developers
          # install locally via Homebrew. 0.61.1 ships fixes for
          # the `indent` + `trailingSpace` over-eager behaviour on
          # empty lines inside multi-line string literals that
          # 0.61.0 still flags.
          brew install swiftlint
          curl -fsSL https://github.com/nicklockwood/SwiftFormat/releases/download/0.61.1/swiftformat.zip -o /tmp/swiftformat.zip
          unzip -q /tmp/swiftformat.zip -d /tmp/swiftformat
          sudo install /tmp/swiftformat/swiftformat /usr/local/bin/swiftformat
          swiftformat --version

      - name: Show tool versions
        run: |
          swiftformat --version
          swiftlint version

      - name: Set up Ruby + bundler (for Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run quality checks via Fastlane
        run: bundle exec fastlane ci_quality
