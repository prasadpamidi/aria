name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Linux — enforces the platform boundary.
  # If anyone leaks an Apple framework into `Aria`, this job breaks.
  # ------------------------------------------------------------------
  linux-core:
    name: Linux — Core Build & Test
    runs-on: ubuntu-latest
    container:
      image: swift:6.1-jammy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SQLite headers
        # GRDB.swift's C shim needs sqlite3.h. The swift Docker image
        # ships with sqlite3 the binary but not the development headers.
        # Aria core does not depend on GRDB, but `swift test` builds
        # every test target — AriaAppleTests transitively pulls GRDB.
        run: apt-get update && apt-get install -y libsqlite3-dev

      - name: Show Swift version
        run: swift --version

      - name: Build core target
        run: swift build --target Aria

      - name: Build testing target
        run: swift build --target AriaTesting

      - name: Build tools target
        run: swift build --target AriaTools

      - name: Run core tests
        run: swift test --filter AriaTests

  # ------------------------------------------------------------------
  # macOS — full build & test of every target including AriaApple.
  # ------------------------------------------------------------------
  macos:
    name: macOS — Full Build & Test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build all targets
        run: swift build

      - name: Run all tests
        run: swift test

      - name: Run CLI demo
        run: swift run AriaCLI

  # ------------------------------------------------------------------
  # iOS — build AriaSample on iOS Simulator (also exercises AriaApple).
  # ------------------------------------------------------------------
  ios-sample:
    name: iOS — AriaSample Build
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List installed Xcodes
        run: ls /Applications | grep -i xcode || true

      - name: Select latest Xcode
        run: |
          # Try the newest Xcode available on the runner; the iOS 26 SDK
          # is required for FoundationModels. We probe candidates in order
          # of preference and select the first that exists.
          for xcode in /Applications/Xcode_26*.app /Applications/Xcode-26*.app /Applications/Xcode_latest.app /Applications/Xcode.app; do
            if [ -d "$xcode" ]; then
              sudo xcode-select -s "$xcode/Contents/Developer"
              echo "Selected: $xcode"
              xcodebuild -version
              break
            fi
          done

      - name: Build AriaSample for iOS Simulator
        run: |
          xcodebuild build \
            -project Examples/SampleApp/AriaSample.xcodeproj \
            -scheme AriaSample \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

  # ------------------------------------------------------------------
  # Quality — SwiftFormat + SwiftLint checks across the codebase.
  # ------------------------------------------------------------------
  quality:
    name: Quality — SwiftFormat & SwiftLint
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tooling
        run: brew install swiftformat swiftlint

      - name: Show tool versions
        run: |
          swiftformat --version
          swiftlint version

      - name: SwiftFormat (lint)
        run: |
          swiftformat \
            Sources Tests \
            --config .swiftformat \
            --lint

      - name: SwiftLint
        run: |
          swiftlint lint \
            Sources Tests \
            --config .swiftlint.yml \
            --strict
