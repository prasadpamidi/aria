name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Linux — enforces the platform boundary.
  # If anyone leaks an Apple framework into `Aria`, this job breaks.
  # ------------------------------------------------------------------
  linux-core:
    name: Linux — Core Build & Test
    runs-on: ubuntu-latest
    container:
      image: swift:5.10-jammy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build core target
        run: swift build --target Aria

      - name: Build testing target
        run: swift build --target AriaTesting

      - name: Build tools target
        run: swift build --target AriaTools

      - name: Run core tests
        run: swift test --filter AriaTests

  # ------------------------------------------------------------------
  # macOS — full build & test of every target including AriaApple.
  # ------------------------------------------------------------------
  macos:
    name: macOS — Full Build & Test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build all targets
        run: swift build

      - name: Run all tests
        run: swift test

      - name: Run CLI demo
        run: swift run AriaCLI

  # ------------------------------------------------------------------
  # iOS — build AriaSample on iOS Simulator (also exercises AriaApple).
  # ------------------------------------------------------------------
  ios-sample:
    name: iOS — AriaSample Build
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build AriaSample for iOS Simulator
        run: |
          xcodebuild build \
            -project Examples/SampleApp/AriaSample.xcodeproj \
            -scheme AriaSample \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

  # ------------------------------------------------------------------
  # Quality — SwiftFormat + SwiftLint checks across the codebase.
  # ------------------------------------------------------------------
  quality:
    name: Quality — SwiftFormat & SwiftLint
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tooling
        run: brew install swiftformat swiftlint

      - name: Show tool versions
        run: |
          swiftformat --version
          swiftlint version

      - name: SwiftFormat (lint)
        run: |
          swiftformat \
            Sources Tests Examples/AriaCLI \
            Examples/SampleApp/AriaSample \
            Examples/SampleApp/AriaSampleTests \
            Examples/SampleApp/AriaSampleUITests \
            --config .swiftformat \
            --lint

      - name: SwiftLint
        run: |
          swiftlint lint \
            Sources Tests Examples/AriaCLI \
            Examples/SampleApp/AriaSample \
            Examples/SampleApp/AriaSampleTests \
            Examples/SampleApp/AriaSampleUITests \
            --config .swiftlint.yml \
            --strict
